<!DOCTYPE html>
<html lang="en" x-data="{ leftOpen: true, rightOpen: false }" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <title>Text to Speech</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="h-full">

<!-- Top Navigation Bar -->
<header class="flex items-center justify-between bg-white border-b px-4 py-3 shadow-sm">
    <div class="flex items-center space-x-3">
        <button @click="leftOpen = !leftOpen" class="text-gray-600 hover:text-black focus:outline-none">
            <!-- Hamburger icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-700">🎧 ElevenLabs UI</h1>
    </div>
    <button @click="rightOpen = !rightOpen" class="text-gray-600 hover:text-black">
        <!-- Gear icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
                  d="M11.3 1.046a1 1 0 00-2.6 0l-.25.6a7.974 7.974 0 00-2.5.9l-.6-.35a1 1 0 00-1.3.4l-.5.87a8.03 8.03 0 00-1.3 2.25l-.9.1a1 1 0 000 2l.9.1a8.03 8.03 0 001.3 2.25l.5.87a1 1 0 001.3.4l.6-.35a7.974 7.974 0 002.5.9l.25.6a1 1 0 002.6 0l.25-.6a7.974 7.974 0 002.5-.9l.6.35a1 1 0 001.3-.4l.5-.87a8.03 8.03 0 001.3-2.25l.9-.1a1 1 0 000-2l-.9-.1a8.03 8.03 0 00-1.3-2.25l-.5-.87a1 1 0 00-1.3-.4l-.6.35a7.974 7.974 0 00-2.5-.9l-.25-.6zM10 13a3 3 0 100-6 3 3 0 000 6z"
                  clip-rule="evenodd"/>
        </svg>
    </button>
</header>

<div class="flex h-full">
    <!-- Sliding Left Sidebar -->
    <aside class="bg-gray-100 border-r w-64 p-4 transform transition-transform duration-300 ease-in-out"
           :class="{ '-translate-x-full': !leftOpen, 'translate-x-0': leftOpen }">
        <h2 class="font-bold text-xl mb-4">🎛 Audio Platform</h2>
        <nav class="space-y-2 text-sm">
            <div class="text-gray-700 font-semibold">Playground</div>
            <ul class="ml-2 space-y-1">
                <li><a href="#" class="text-blue-600 font-medium">Text to Speech</a></li>
                <li><a href="#">Voice Changer</a></li>
                <li><a href="#">Sound Effects</a></li>
                <li><a href="#">Voice Isolator</a></li>
            </ul>
            <div class="mt-4 text-gray-700 font-semibold">Products</div>
            <ul class="ml-2 space-y-1">
                <li><a href="#">Studio</a></li>
                <li><a href="#">Dubbing</a></li>
                <li><a href="#">Speech to Text</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm mb-4 inline-block">🔮 Rachel</span>
        <textarea rows="6" class="w-full border p-4 rounded-md shadow"
                  placeholder="Type your message here...">Hey Binchayan and Rajeev family, enjoy the summer holidays!
We’ll be right here... eagerly waiting for those Indian snacks!</textarea>
        <div class="mt-4 flex gap-4">
            <button class="bg-black text-white px-4 py-2 rounded hover:bg-gray-800">Generate speech</button>
            <button class="border px-4 py-2 rounded">Enhance (alpha)</button>
        </div>
    </main>

    <!-- Sliding Right Sidebar -->
    <aside class="w-64 bg-gray-50 border-l p-4 transform transition-transform duration-300 ease-in-out"
           :class="{ 'translate-x-0': rightOpen, 'translate-x-full': !rightOpen }">
        <div class="mb-4">
            <label class="block text-gray-600 font-medium mb-1">Voice</label>
            <select class="w-full border p-2 rounded">
                <option>Rachel</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block text-gray-600 font-medium mb-1">Model</label>
            <div class="border p-2 rounded text-sm">
                <strong>V3</strong> Eleven v3 (alpha)<br>
                <p class="text-gray-500 text-xs mt-1">Most expressive TTS model. Prompt-sensitive. <a href="#" class="text-blue-500">Learn more</a></p>
            </div>
        </div>
        <div>
            <label class="block text-gray-600 font-medium mb-1">Stability</label>
            <input type="range" min="0" max="100" value="50" class="w-full">
        </div>
    </aside>
</div>

</body>
</html>
